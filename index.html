<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps Message Board</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", sans-serif;
            background-color: #EAE0CF;
            min-height: 100vh;
            padding: 40px 20px;
            color: #111844;
        }

        .container {
            max-width: 800px;
            margin: auto;
        }

        .header {
            text-align: center;
            margin-bottom: 35px;
        }

        .header h1 {
            font-size: 2.5rem;
            color: #111844;
            margin-bottom: 10px;
        }

        .header p {
            color: #4B5694;
            font-size: 1rem;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(17, 24, 68, 0.12);
        }

        .add-form {
            display: flex;
            gap: 12px;
            margin-bottom: 25px;
        }

        input {
            flex: 1;
            padding: 14px;
            border: 2px solid #7288AE;
            border-radius: 10px;
            font-size: 1rem;
            outline: none;
        }

        input:focus {
            border-color: #4B5694;
        }

        button {
            background: #111844;
            color: #EAE0CF;
            border: none;
            border-radius: 10px;
            padding: 14px 24px;
            cursor: pointer;
            font-size: 1rem;
            transition: 0.2s ease;
        }

        button:hover {
            background: #4B5694;
        }

        .messages-title {
            margin-bottom: 15px;
            color: #111844;
        }

        .message {
            background: #EAE0CF;
            border-left: 5px solid #4B5694;
            padding: 14px;
            border-radius: 8px;
            margin-bottom: 12px;
            word-wrap: break-word;

            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .message-text {
            flex: 1;
        }

        .delete-form {
            margin: 0;
        }

        .delete-button {
            background: #8B1E3F;
            color: white;
            padding: 9px 15px;
            border-radius: 8px;
            font-size: 0.9rem;
        }

        .delete-button:hover {
            background: #B02A4A;
        }

        .empty-state {
            text-align: center;
            color: #7288AE;
            padding: 20px;
        }

        .footer {
            margin-top: 25px;
            text-align: center;
            color: #7288AE;
            font-size: 0.9rem;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>DevOps Message Board</h1>
        <p>Flask • Docker • MySQL • CI/CD Journey</p>
    </div>

    <div class="card">

        <form class="add-form" action="/add" method="POST">
            <input
                type="text"
                name="message"
                placeholder="Write a message..."
                required
            >
            <button type="submit">Add</button>
        </form>

        <h3 class="messages-title">Messages</h3>

        {% if messages %}

            {% for message in messages %}

                <div class="message">

                    <div class="message-text">
                        {{ message[1] }}
                    </div>

                    <form
                        class="delete-form"
                        action="/delete/{{ message[0] }}"
                        method="POST"
                    >
                        <button
                            type="submit"
                            class="delete-button"
                        >
                            Delete
                        </button>
                    </form>

                </div>

            {% endfor %}

        {% else %}

            <div class="empty-state">
                No messages yet. Add your first one 🚀
            </div>

        {% endif %}

    </div>

    <div class="footer">
        Built during a DevOps learning journey.
    </div>

</div>

</body>

</html>
